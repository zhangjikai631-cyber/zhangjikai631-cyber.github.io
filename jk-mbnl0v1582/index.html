<html lang="zh-CN">
<head>

<title>思维精华回顾</title>

<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --text: #1c1630;
    --text2: #4a4260;
    --text3: #8a829a;
    --border: #e8e2d8;
    --border2: #d4cdc0;
    --purple: #2E1F6E;
    --purple2: #4a348f;
    --amber: #c47a2c;
    --amber-soft: #f5e6d0;
    --purple-soft: #ece8f7;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body {
    padding: 20px 16px 56px;
    padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .hero {
    background: linear-gradient(145deg, #2E1F6E 0%, #4a348f 55%, #c47a2c 140%);
    color: #fff;
    border-radius: 22px;
    padding: 22px 20px 18px;
    margin-bottom: 18px;
    box-shadow: 0 10px 28px rgba(46,31,110,.22);
  }
  .hero h1 {
    font-size: 24px; font-weight: 700; line-height: 1.35;
    margin: 0 0 8px;
  }
  .hero .sub {
    font-size: 15px; line-height: 1.65;
    opacity: .92; margin: 0 0 10px;
  }
  .hero .updated {
    font-size: 12px; opacity: .75; margin: 0;
  }
  .howto {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 14px; line-height: 1.7;
    color: var(--text2);
    margin-bottom: 18px;
  }
  .howto strong {
    display: block; color: var(--text);
    margin-bottom: 6px; font-size: 14px;
  }
  .howto ol { margin: 6px 0 0; padding-left: 1.2em; }
  .howto li { margin-bottom: 4px; }
  .panel { margin-bottom: 18px; }
  .panel-title {
    font-size: 13px; font-weight: 600;
    color: var(--text3); letter-spacing: .04em;
    margin: 0 0 10px; text-transform: none;
  }
  .chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 12px;
  }
  .chip {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text2);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px; line-height: 1.3;
    cursor: pointer;
  }
  .chip.active {
    background: var(--purple);
    border-color: var(--purple);
    color: #fff;
  }
  .chip.soft.active {
    background: var(--amber);
    border-color: var(--amber);
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; margin-bottom: 8px;
  }
  .btn {
    appearance: none;
    border: none;
    background: var(--purple);
    color: #fff;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .btn.ghost {
    background: var(--card);
    color: var(--purple);
    border: 1px solid var(--border2);
  }
  .count {
    font-size: 13px; color: var(--text3);
    margin-left: 4px;
  }
  .cat-desc {
    font-size: 13px; line-height: 1.6;
    color: var(--text2);
    background: var(--purple-soft);
    border-radius: 12px;
    padding: 10px 12px;
    margin: 0 0 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 16px 14px;
    margin-bottom: 14px;
    box-shadow: 0 1px 0 rgba(46,31,110,.04);
  }
  .card.highlight {
    border-color: var(--amber);
    box-shadow: 0 0 0 2px rgba(196,122,44,.18);
  }
  .card-top {
    display: flex; justify-content: space-between;
    gap: 12px; align-items: flex-start;
  }
  .q {
    font-size: 18px; font-weight: 700;
    line-height: 1.45; color: var(--text);
    margin: 0 0 10px; flex: 1;
  }
  .star {
    border: none; background: transparent;
    color: var(--text3); font-size: 24px;
    line-height: 1; padding: 0; cursor: pointer;
    flex-shrink: 0;
  }
  .star.on { color: var(--amber); }
  .conclusion {
    font-size: 16px; font-weight: 600;
    line-height: 1.55; color: var(--purple2);
    margin: 0 0 12px;
    padding: 10px 12px;
    background: var(--purple-soft);
    border-radius: 12px;
  }
  .conclusion::before {
    content: "想通的结论";
    display: block;
    font-size: 12px; font-weight: 600;
    color: var(--text3); margin-bottom: 4px;
    letter-spacing: .04em;
  }
  details.block {
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  details.block summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 0 10px;
    font-size: 15px; font-weight: 600;
    color: var(--purple2);
    display: flex; align-items: center; gap: 8px;
  }
  details.block summary::-webkit-details-marker { display: none; }
  details.block summary::before {
    content: "›";
    display: inline-block;
    transition: transform .2s ease;
    font-size: 18px; line-height: 1;
    color: var(--amber);
  }
  details.block[open] summary::before { transform: rotate(90deg); }
  .process {
    margin: 0 0 8px; padding-left: 0;
    list-style: none;
  }
  .process li {
    position: relative;
    padding: 0 0 12px 28px;
    font-size: 16px; line-height: 1.7;
    color: var(--text2);
  }
  .process li:last-child { padding-bottom: 4px; }
  .process li::before {
    content: attr(data-n);
    position: absolute; left: 0; top: 2px;
    width: 20px; height: 20px;
    border-radius: 999px;
    background: var(--amber-soft);
    color: var(--amber);
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 20px;
  }
  .extend {
    margin: 0; padding: 0 0 8px;
    font-size: 16px; line-height: 1.7;
    color: var(--text2);
  }
  .extend p { margin: 0 0 8px; }
  .open-q {
    margin: 8px 0 4px;
    padding: 10px 12px;
    background: var(--amber-soft);
    border-radius: 12px;
    font-size: 15px; line-height: 1.6;
    color: var(--text);
  }
  .open-q strong {
    display: block; font-size: 12px;
    color: var(--amber); margin-bottom: 4px;
  }
  .meta {
    display: flex; flex-wrap: wrap;
    gap: 6px 10px; align-items: center;
    margin-top: 10px;
    font-size: 12px; color: var(--text3);
  }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text2);
  }
  .section-head {
    margin: 28px 0 12px;
  }
  .section-head h2 {
    font-size: 18px; font-weight: 700;
    margin: 0 0 6px; color: var(--text);
  }
  .section-head p {
    margin: 0; font-size: 14px;
    line-height: 1.65; color: var(--text2);
  }
  .tool {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .tool .name {
    font-size: 17px; font-weight: 700;
    margin: 0 0 4px; color: var(--text);
  }
  .tool .from {
    font-size: 12px; color: var(--text3);
    margin: 0 0 10px;
  }
  .tool .solve {
    font-size: 15px; line-height: 1.6;
    color: var(--text2); margin: 0 0 8px;
  }
  .tool details summary {
    list-style: none; cursor: pointer;
    font-size: 14px; font-weight: 600;
    color: var(--purple2);
    padding: 8px 0;
  }
  .tool details summary::-webkit-details-marker { display: none; }
  .tool details summary::before {
    content: "› "; color: var(--amber);
  }
  .tool details[open] summary::before { content: "▾ "; }
  .tool .steps {
    margin: 0; padding-left: 1.2em;
    font-size: 15px; line-height: 1.7; color: var(--text2);
  }
  .tool .ex {
    margin: 8px 0 0;
    padding: 10px 12px;
    background: var(--amber-soft);
    border-radius: 12px;
    font-size: 14px; line-height: 1.6; color: var(--text);
  }
  .tool .ex em {
    font-style: normal; font-size: 12px;
    color: var(--amber); font-weight: 600;
    display: block; margin-bottom: 2px;
  }
  .tool .links {
    margin-top: 8px; font-size: 12px; color: var(--text3);
  }
  .empty {
    text-align: center; color: var(--text3);
    padding: 32px 12px; font-size: 15px;
  }
  .footer-note {
    margin-top: 28px;
    font-size: 12px; color: var(--text3);
    line-height: 1.6; text-align: center;
  }
</style>

</head>

<div class="wrap">

    <p class="updated">更新于 2026-11-05（北京时间）· 12 条思考 · 11 个工具</p>
  </header>

      <li>先看上面的分类：看清问题 / 做判断 / 行动与取舍 / 表达与成长。</li>

      <button type="button" class="btn" id="btnRandom">随机翻一条</button>
      <button type="button" class="btn ghost" id="btnAll">看列表</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div id="essencePanel">
    <div id="list"></div>
  </div>
  <div id="toolsPanel" style="display:none"></div>

  <p class="footer-note">书只是触发；中心是你自己的思考。每晚有新的想通之处，会追加进来。</p>
</div>

const FAV_KEY = "essence-favs-v1";
const state = { category: "all", favOnly: false, randomId: null, view: "essences" };

function loadFavs() {
  try {
    const raw = localStorage.getItem(FAV_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}
function saveFavs(ids) {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(ids)); } catch (e) {}
}
let favs = loadFavs();

function formatDate(d) {
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return d;
  return m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日";
}
function catName(id) {
  const c = CATEGORIES.find(function (x) { return x.id === id; });
  return c ? c.name : id;
}
function filteredEssences() {
  return ESSENCES.filter(function (e) {
    if (state.category !== "all" && e.category !== state.category) return false;
    if (state.favOnly && favs.indexOf(e.id) < 0) return false;
    return true;
  }).slice().sort(function (a, b) {
    if (a.date < b.date) return 1;
    if (a.date > b.date) return -1;
    return a.id < b.id ? 1 : -1;
  });
}
function toolById(id) {
  return COURSE_TOOLS.concat(BOOK_TOOLS).find(function (t) { return t.id === id; });
}
function toggleFav(id) {
  if (favs.indexOf(id) >= 0) favs = favs.filter(function (x) { return x !== id; });
  else favs = favs.concat([id]);
  saveFavs(favs);
  render();
}
function pickRandom() {
  const pool = filteredEssences();
  const list = pool.length ? pool : ESSENCES;
  if (!list.length) return;
  state.randomId = list[Math.floor(Math.random() * list.length)].id;
  state.view = "essences";
  render();
  const el = document.getElementById("card-" + state.randomId);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
function renderChips() {
  const box = document.getElementById("catChips");
  box.innerHTML = "";
  CATEGORIES.forEach(function (c) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (state.category === c.id ? " active" : "");
    b.textContent = c.name;
    b.onclick = function () {
      state.category = c.id;
      state.randomId = null;
      state.view = "essences";
      render();
    };
    box.appendChild(b);
  });
  const fav = document.createElement("button");
  fav.type = "button";
  fav.className = "chip soft" + (state.favOnly ? " active" : "");
  fav.textContent = "只看收藏";
  fav.onclick = function () { state.favOnly = !state.favOnly; state.randomId = null; render(); };
  box.appendChild(fav);

  const tools = document.createElement("button");
  tools.type = "button";
  tools.className = "chip" + (state.view === "tools" ? " active" : "");
  tools.textContent = "思维工具箱";
  tools.onclick = function () { state.view = state.view === "tools" ? "essences" : "tools"; render(); };
  box.appendChild(tools);
}
function renderCard(e, highlight) {
  const starred = favs.indexOf(e.id) >= 0;
  const toolNames = (e.tools || []).map(function (id) {
    const t = toolById(id);
    return t ? (t.name || t.id) : id;
  }).filter(Boolean);
  const process = e.process.map(function (step, i) {
    return '<li data-n="' + (i + 1) + '">' + escapeHtml(step) + "</li>";
  }).join("");
  const extend = e.extend.map(function (x) {
    return "<p>" + escapeHtml(x) + "</p>";
  }).join("");
  return (
    '<article class="card' + (highlight ? " highlight" : "") + '" id="card-' + e.id + '">' +
      '<div class="card-top">' +
        '<h3 class="q">' + escapeHtml(e.question) + "</h3>" +
        '<button type="button" class="star' + (starred ? " on" : "") + '" aria-label="' + (starred ? "取消收藏" : "收藏") + '" data-fav="' + e.id + '">' + (starred ? "★" : "☆") + "</button>" +
      "</div>" +
      '<div class="conclusion">' + escapeHtml(e.conclusion) + "</div>" +
      '<details class="block">' +
        "<summary>思考过程</summary>" +
        '<ol class="process">' + process + "</ol>" +
      "</details>" +
      '<details class="block">' +
        "<summary>还能往哪想</summary>" +
        '<div class="extend">' + extend +
          '<div class="open-q"><strong>留给以后的问题</strong>' + escapeHtml(e.openQuestion) + "</div>" +
        "</div>" +
      "</details>" +
      '<div class="meta">' +
        "<span>" + formatDate(e.date) + "</span>" +
        '<span class="tag">' + escapeHtml(e.source) + "</span>" +
        '<span class="tag">' + escapeHtml(catName(e.category)) + "</span>" +
        (toolNames.length ? '<span class="tag">相关：' + escapeHtml(toolNames.join("、")) + "</span>" : "") +
      "</div>" +
    "</article>"
  );
}
function renderTool(t, isBook) {
  const relatedTitles = (t.related || []).map(function (id) {
    const e = ESSENCES.find(function (x) { return x.id === id; });
    return e ? e.question : null;
  }).filter(Boolean);
  const steps = t.steps.map(function (s) { return "<li>" + escapeHtml(s) + "</li>"; }).join("");
  return (
    '<div class="tool" id="tool-' + t.id + '">' +
      '<div class="name">' + escapeHtml(t.name) + "</div>" +
      '<div class="from">' + (isBook ? ("来自《" + escapeHtml(t.book) + "》") : ("来自" + escapeHtml(t.from))) + "</div>" +
      '<p class="solve"><strong>它解决什么：</strong>' + escapeHtml(t.solves) + "</p>" +
      '<p class="solve"><strong>什么时候用：</strong>' + escapeHtml(t.when) + "</p>" +
      "<details><summary>怎么用</summary><ol class='steps'>" + steps + "</ol></details>" +
      '<div class="ex"><em>用在你身上（示例）</em>' + escapeHtml(t.example) + "</div>" +
      (relatedTitles.length ? '<div class="links">连到你的思考：' + escapeHtml(relatedTitles.join("；")) + "</div>" : "") +
    "</div>"
  );
}
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

  const count = document.getElementById("count");
  const toolsPanel = document.getElementById("toolsPanel");
  const essencePanel = document.getElementById("essencePanel");

  if (state.view === "tools") {
    essencePanel.style.display = "none";
    toolsPanel.style.display = "block";
    desc.textContent = "课上练过的方法 + 你读过的书里真正出现过的思维架子。展开看步骤；示例按你的工厂销售和口播来写。";
    count.textContent = "";
    let html = "";
    html += '<div class="section-head"><h2>课上练过的</h2><p>可反复调用的思考动作。</p></div>';
    COURSE_TOOLS.forEach(function (t) { html += renderTool(t, false); });
    html += '<div class="section-head"><h2>思维工具箱 · 来自书里</h2><p>依据你提供的摘录和阅读观察卡整理；《人类简史》《文明之旅》还没有可用摘录，暂未收入。</p></div>';
    BOOK_TOOLS.forEach(function (t) { html += renderTool(t, true); });
    toolsPanel.innerHTML = html;
    return;
  }

  toolsPanel.style.display = "none";
  essencePanel.style.display = "block";
  const cat = CATEGORIES.find(function (c) { return c.id === state.category; });
  desc.textContent = cat && cat.desc ? cat.desc : "每条默认只看问题和结论；点开「思考过程」「还能往哪想」。星标存在本机。";
  let items = filteredEssences();
  if (state.randomId) {
    const one = ESSENCES.find(function (e) { return e.id === state.randomId; });
    items = one ? [one] : items;
  }
  count.textContent = state.randomId ? "随机 1 条" : ("共 " + items.length + " 条");
  if (!items.length) {
    list.innerHTML = '<div class="empty">这一类暂时没有。换个分类，或关掉「只看收藏」。</div>';
    return;
  }
  list.innerHTML = items.map(function (e) {
    return renderCard(e, state.randomId === e.id);
  }).join("");
  Array.prototype.forEach.call(list.querySelectorAll("[data-fav]"), function (btn) {
    btn.onclick = function () { toggleFav(btn.getAttribute("data-fav")); };
  });
}

document.getElementById("btnRandom").onclick = pickRandom;
document.getElementById("btnAll").onclick = function () {
  state.randomId = null; state.view = "essences"; render();
};
render();

</script>
</body>
</html>
