const FAV_KEY = "essence-favs-v1";
const FAV_K_KEY = "knowledge-favs-v1";
const state = { category: "all", field: "全部领域", favOnly: false, randomId: null, view: "essences" };

function loadList(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}
function saveList(key, ids) {
  try { localStorage.setItem(key, JSON.stringify(ids)); } catch (e) {}
}
let favs = loadList(FAV_KEY);
let kFavs = loadList(FAV_K_KEY);

function gradeLabel(total) {
  if (total >= 23) return "★★★★★";
  if (total >= 20) return "★★★★";
  if (total >= 17) return "★★★";
  return "★★";
}
function formatDate(d) {
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return d;
  return m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日";
}
function catName(id) {
  const c = CATEGORIES.find(function (x) { return x.id === id; });
  return c ? c.name : id;
}
function filteredEssences() {
  return ESSENCES.filter(function (e) {
    if (state.category !== "all" && e.category !== state.category) return false;
    if (state.favOnly && favs.indexOf(e.id) < 0) return false;
    return true;
  }).slice().sort(function (a, b) {
    if (a.date < b.date) return 1;
    if (a.date > b.date) return -1;
    return a.id < b.id ? 1 : -1;
  });
}
function filteredKnowledge() {
  return KNOWLEDGE.filter(function (k) {
    if (state.field !== "全部领域" && k.field !== state.field) return false;
    if (state.favOnly && kFavs.indexOf(k.id) < 0) return false;
    return true;
  }).slice().sort(function (a, b) {
    if (a.date < b.date) return 1;
    if (a.date > b.date) return -1;
    return a.id < b.id ? 1 : -1;
  });
}
function fieldBreadth() {
  const map = {};
  KNOWLEDGE.forEach(function (k) {
    map[k.field] = (map[k.field] || 0) + 1;
  });
  return map;
}
function toolById(id) {
  return COURSE_TOOLS.concat(BOOK_TOOLS).find(function (t) { return t.id === id; });
}
function toggleFav(id) {
  if (favs.indexOf(id) >= 0) favs = favs.filter(function (x) { return x !== id; });
  else favs = favs.concat([id]);
  saveList(FAV_KEY, favs);
  render();
}
function toggleKFav(id) {
  if (kFavs.indexOf(id) >= 0) kFavs = kFavs.filter(function (x) { return x !== id; });
  else kFavs = kFavs.concat([id]);
  saveList(FAV_K_KEY, kFavs);
  render();
}
function pickRandom() {
  if (state.view === "knowledge") {
    const pool = filteredKnowledge();
    const list = pool.length ? pool : KNOWLEDGE;
    if (!list.length) return;
    state.randomId = list[Math.floor(Math.random() * list.length)].id;
    render();
    const el = document.getElementById("kcard-" + state.randomId);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (state.view !== "essences") state.view = "essences";
  const pool = filteredEssences();
  const list = pool.length ? pool : ESSENCES;
  if (!list.length) return;
  state.randomId = list[Math.floor(Math.random() * list.length)].id;
  render();
  const el = document.getElementById("card-" + state.randomId);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
function renderViewChips() {

function renderChain(chain) {
  if (!chain || !chain.nodes || !chain.nodes.length) return "";
  const parts = [];
  chain.nodes.forEach(function (node, i) {
    if (i > 0) parts.push('<div class="chain-arrow" aria-hidden="true">→</div>');
    parts.push('<div class="chain-node">' + escapeHtml(node) + "</div>");
  });
  return (
    '<div class="chain">' +
      '<div class="chain-label">' + escapeHtml(chain.title || "这条链的先后") + "</div>" +
      '<div class="chain-hint">左右滑动看完整次序 →</div>' +
      '<div class="chain-scroll" role="region" aria-label="思考链次序">' +
        '<div class="chain-row">' + parts.join("") + "</div>" +
      "</div>" +
    "</div>"
  );
}
function renderCard(e, highlight) {
  const starred = favs.indexOf(e.id) >= 0;
  const toolNames = (e.tools || []).map(function (id) {
    const t = toolById(id);
    return t ? (t.name || t.id) : id;
  }).filter(Boolean);
  const process = (e.process || []).map(function (step, i) {
    return '<li data-n="' + (i + 1) + '">' + escapeHtml(step) + "</li>";
  }).join("");
  const extend = (e.extend || []).map(function (x) {
    return "<p>" + escapeHtml(x) + "</p>";
  }).join("");
  return (
    '<article class="card' + (highlight ? " highlight" : "") + '" id="card-' + e.id + '">' +
      '<div class="card-top">' +
        '<h3 class="q">' + escapeHtml(e.question) + "</h3>" +
        '<button type="button" class="star' + (starred ? " on" : "") + '" aria-label="收藏" data-fav="' + e.id + '">' + (starred ? "★" : "☆") + "</button>" +
      "</div>" +
      '<div class="conclusion">' + escapeHtml(e.conclusion) + "</div>" +
      renderChain(e.chain) +
      '<details class="block"><summary>思考过程</summary><ol class="process">' + process + "</ol></details>" +
      '<details class="block"><summary>还能往哪想</summary><div class="extend">' + extend +
        '<div class="open-q"><strong>留给以后的问题</strong>' + escapeHtml(e.openQuestion || "") + "</div></div></details>" +
      '<div class="meta">' +
        "<span>" + formatDate(e.date) + "</span>" +
        '<span class="tag">' + escapeHtml(e.source) + "</span>" +
        '<span class="tag">' + escapeHtml(catName(e.category)) + "</span>" +
        (e.rating && e.rating.total ? '<span class="tag grade">品质 ' + e.rating.total + '/25 · ' + gradeLabel(e.rating.total) + "</span>" : "") +
        (toolNames.length ? '<span class="tag">相关：' + escapeHtml(toolNames.join("、")) + "</span>" : "") +
      "</div>" +
    "</article>"
  );
}
function renderKnowledgeCard(k, highlight) {
  const starred = kFavs.indexOf(k.id) >= 0;
  const links = (k.links || []).map(function (x) { return "<p>" + escapeHtml(x) + "</p>"; }).join("");
  return (
    '<article class="card' + (highlight ? " highlight" : "") + '" id="kcard-' + k.id + '">' +
      '<div class="card-top">' +
        '<h3 class="q">' + escapeHtml(k.book) + " · " + escapeHtml(k.field) + "</h3>" +
        '<button type="button" class="star' + (starred ? " on" : "") + '" data-kfav="' + k.id + '">' + (starred ? "★" : "☆") + "</button>" +
      "</div>" +
      '<div class="k-point">' + escapeHtml(k.point) + "</div>" +
      '<details class="block" open><summary>为什么重要</summary><div class="extend"><p>' + escapeHtml(k.why) + "</p></div></details>" +
      '<details class="block"><summary>和你知道的事连起来</summary><div class="extend">' + links + "</div></details>" +
      (k.example ? '<details class="block"><summary>讲给别人的小例子</summary><div class="extend"><p>' + escapeHtml(k.example) + "</p></div></details>" : "") +
      '<div class="meta">' +
        "<span>" + formatDate(k.date) + "</span>" +
        '<span class="tag">' + escapeHtml(k.field) + "</span>" +
        '<span class="tag">《' + escapeHtml(k.book) + "》</span>" +
        (k.rating && k.rating.total ? '<span class="tag grade">品质 ' + k.rating.total + '/25 · ' + gradeLabel(k.rating.total) + "</span>" : "") +
      "</div>" +
    "</article>"

function renderTool(t, isBook) {
  const relatedTitles = (t.related || []).map(function (id) {
    const e = ESSENCES.find(function (x) { return x.id === id; });
    return e ? e.question : null;
  }).filter(Boolean);
  const steps = t.steps.map(function (s) { return "<li>" + escapeHtml(s) + "</li>"; }).join("");
  return (
    '<div class="tool" id="tool-' + t.id + '">' +
      '<div class="name">' + escapeHtml(t.name) + "</div>" +
      '<div class="from">' + (isBook ? ("来自《" + escapeHtml(t.book) + "》") : ("来自" + escapeHtml(t.from))) + "</div>" +
      '<p class="solve"><strong>它解决什么：</strong>' + escapeHtml(t.solves) + "</p>" +
      '<p class="solve"><strong>什么时候用：</strong>' + escapeHtml(t.when) + "</p>" +
      "<details><summary>怎么用</summary><ol class='steps'>" + steps + "</ol></details>" +
      '<div class="ex"><em>用在你身上（示例）</em>' + escapeHtml(t.example) + "</div>" +
      (relatedTitles.length ? '<div class="links">连到你的思考：' + escapeHtml(relatedTitles.join("；")) + "</div>" : "") +
    "</div>"
  );
}
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&")
    .replace(/</g, "<")
    .replace(/>/g, ">")
    .replace(/"/g, """);
}
function renderBreadth() {
  const map = fieldBreadth();
  const fields = ["历史", "经济", "商业", "科技", "人性", "社会", "学习", "其他"];
  let html = '<div class="breadth">';
  fields.forEach(function (f) {
    const n = map[f] || 0;
    html += '<div class="cell"><div class="n">' + n + '</div><div class="l">' + f + "</div></div>";
  });
  html += "</div>";
  return html;
}

  if (state.view === "knowledge") {
    knowledgePanel.style.display = "block";
    desc.textContent = "书里学到的、能拓宽视野的知识点。按领域看你的知识面有多宽。过知识品质分才入库。";
    let items = filteredKnowledge();
    if (state.randomId) {
      const one = KNOWLEDGE.find(function (k) { return k.id === state.randomId; });
      items = one ? [one] : items;
    }
    count.textContent = state.randomId ? "随机 1 条" : ("共 " + items.length + " 条");
    let html = renderBreadth();
    if (!KNOWLEDGE.length) {
      html += '<div class="empty-hero"><p class="big">知识库从今天开始攒</p><p class="small">读到一个讲得清、能拓宽视野、还能连到你生活的知识点，过了知识品质分（≥20，且每一项不低于 3）再放进来。上面的领域格子会慢慢亮起来。</p></div>';
      knowledgePanel.innerHTML = html;
      return;
    }
    if (!items.length) {
      html += '<div class="empty">这一领域暂时没有。换个领域，或关掉「只看收藏」。</div>';
      knowledgePanel.innerHTML = html;
      return;
    }
    html += items.map(function (k) { return renderKnowledgeCard(k, state.randomId === k.id); }).join("");
    knowledgePanel.innerHTML = html;
    Array.prototype.forEach.call(knowledgePanel.querySelectorAll("[data-kfav]"), function (btn) {
      btn.onclick = function () { toggleKFav(btn.getAttribute("data-kfav")); };
    });
    return;
  }

  // essences
  essencePanel.style.display = "block";
  const cat = CATEGORIES.find(function (c) { return c.id === state.category; });
  desc.textContent = cat && cat.desc ? cat.desc : "每条默认只看问题和结论；点开思考过程与延伸。星标存在本机。";
  let items = filteredEssences();
  if (state.randomId) {
    const one = ESSENCES.find(function (e) { return e.id === state.randomId; });
    items = one ? [one] : items;
  }
  count.textContent = state.randomId ? "随机 1 条" : ("共 " + items.length + " 条");
  if (!items.length) {
    if (ESSENCES.length === 0) {
      list.innerHTML = '<div class="empty-hero"><p class="big">从今天开始攒，只收值得反复想的</p><p class="small">分类和思维工具箱还在。每晚想通一条，过了思考品质分（≥20，且每一项不低于 3）才放进来。</p></div>';
    } else {
      list.innerHTML = '<div class="empty">这一类暂时没有。换个分类，或关掉「只看收藏」。</div>';
    }
    return;
  }
  list.innerHTML = items.map(function (e) {
    return renderCard(e, state.randomId === e.id);
  }).join("");
  Array.prototype.forEach.call(list.querySelectorAll("[data-fav]"), function (btn) {
    btn.onclick = function () { toggleFav(btn.getAttribute("data-fav")); };
  });
}

document.getElementById("btnRandom").onclick = pickRandom;
document.getElementById("btnAll").onclick = function () {
  state.randomId = null;
  if (state.view === "tools") state.view = "essences";
  render();
};
render();

</script>
</body>
</html>
